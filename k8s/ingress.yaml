apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollive-ingress
  namespace: ollive
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"    # SSE streaming — keep connection alive
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"        # Required for SSE — disable buffering
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Connection '';
      chunked_transfer_encoding on;
  labels:
    app: ollive
spec:
  ingressClassName: nginx    # requires nginx ingress controller
  rules:
    - host: ollive.local      # change to your domain or IP
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ollive-backend
                port:
                  number: 3001
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ollive-backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollive-frontend
                port:
                  number: 5173
# TLS (optional — add your cert-manager or manual cert):
# spec:
#   tls:
#     - hosts:
#         - ollive.local
#       secretName: ollive-tls
