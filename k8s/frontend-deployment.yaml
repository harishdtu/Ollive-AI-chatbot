apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-frontend
  namespace: ollive
  labels:
    app: ollive-frontend
spec:
  replicas: 2          # Frontend is stateless — safe to scale
  selector:
    matchLabels:
      app: ollive-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ollive-frontend
    spec:
      containers:
        - name: frontend
          image: ollive-frontend:latest   # built from frontend/Dockerfile
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://ollive-backend:3001"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ollive-frontend
  namespace: ollive
  labels:
    app: ollive-frontend
spec:
  selector:
    app: ollive-frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
  type: ClusterIP
